openapi: 3.1.0
info:
  title: AxisPay API
  version: v1
  summary: Public API for creating and tracking payment links, and reading their payments and events.
  description: |
    Contract of the public API v1 (master plan section 10; ADR-0048 for the
    Phase 3 rules). Phase 3: payment links. Payment reads (`GET /payments`, ADR-0062).
    Phase 5: the event history
    (ADR-0060), and, under `webhooks`, what AxisPay sends to your server: the
    events (ADR-0057) and the pre-payment validation call (ADR-0058). The
    merchant guide is `docs/guides/webhooks.md`.

    Conventions (plan 10.1):
    - JSON UTF-8; `Content-Type: application/json` is required on requests with a body.
    - Versioned in the path (`/v1`). Compatible additions do not change the version.
      **Integrators must ignore unknown fields.**
    - IDs carry a type prefix (`plink_`, `pay_`, `re_`, `evt_`); a wrong prefix answers `404`.
    - Timestamps are ISO-8601 in UTC with `Z`.
    - Money amounts are decimal **strings** (`"150.50"`), never JSON numbers; responses
      also include `amount_minor` (integer minor units).
    - Every response carries a `Request-Id` header, also present in our logs.
    - The API is server-to-server only: never call it from a payer's browser (no CORS).

    Authentication (plan 10.2): `Authorization: Bearer axp_test_...` or `axp_live_...`.
    The prefix selects the mode; a test key never reaches live resources (another mode's
    resource answers `404`). A missing, unknown, revoked, expired or wrong-mode key, or a key of
    an account closed more than 30 days ago, answers `401 invalid_api_key`. Each endpoint needs a scope (`links:create`, `links:read`,
    `links:cancel`, `payments:read`, `events:read`); a key without it gets `403 insufficient_scope`. Keys are created and
    revoked in the tenant panel only. After 30 failed authentications in a minute from the
    same IP, every request from it answers `429 rate_limited` for the rest of the minute.

    Account status: a suspended account can read and cancel but not create
    (`403 tenant_suspended`). A closed account is read-only (POSTs answer
    `403 tenant_suspended`) for 30 days after closing; then its keys answer `401`.

    Idempotency (plan 10.3): `Idempotency-Key` is required on `POST /payment_links` and
    honored on the other POSTs. The same key and body within 24 hours replays the stored
    status and body with `Idempotent-Replayed: true` (4xx answers included; 5xx answers are
    never stored). The same key with another body answers `422 idempotency_key_reused`;
    while the first request runs, `409 idempotency_request_in_progress`. Bodies are compared
    as JSON (key order and whitespace ignored; an empty body, `{}` and `[]` are the same).
    Keys are scoped per account and mode. A key that created a payment link stays bound to
    it: after 24 hours the same body returns that link, another body still answers `422`.
    Stored 4xx answers (for example `409 gateway_not_ready`) are also replayed for 24 hours:
    retry with a new key once the cause is fixed. A request left unfinished for 5 minutes
    frees its key.

    Rate limiting (plan 10.1): 100 requests per minute per API key by default. Every
    response to an authenticated key, errors included, carries `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset`; over the limit the answer is
    `429 rate_limited` with `Retry-After`. Answers to requests that did not authenticate
    (`401`, and the failed-authentication `429`) carry only `Retry-After` where it applies.

    Not part of this contract: the incoming Stripe webhook endpoints served on the same
    host outside `/v1` (`POST /webhooks/stripe/connect/{mode}`,
    `POST /webhooks/stripe/direct/{connection_id}`, ADR-0047). They are called by Stripe
    only, authenticated by Stripe's signature, and answer errors in the same envelope.
servers:
  - url: https://api.{domain}/v1
    description: Production
    variables:
      domain:
        default: example.com
        description: Platform domain (pending, open question 10).
  - url: http://api.localhost:8000/v1
    description: Local development (ADR-0027)
security:
  - apiKey: []
tags:
  - name: Payment links
    description: Single-use, reopenable payment links (plan 10.5, ADR-006).
  - name: Payments
    description: Read-only payments, one per gateway attempt of a link (plan 10.6, ADR-0062).
  - name: Events
    description: Event history for integrators (plan 10.8, ADR-0060).
  - name: Outgoing webhooks
    description: Events AxisPay sends to your endpoints (plan 15, ADR-0057). Described under `webhooks`.
  - name: Pre-payment validation
    description: The synchronous question AxisPay asks your server before charging (plan 15.8, ADR-0058). Described under `webhooks`.
paths:
  /payment_links:
    post:
      tags: [Payment links]
      operationId: createPaymentLink
      summary: Create a payment link
      description: |
        Scope `links:create`. `Idempotency-Key` is required. The account must be `active` or
        `grace` (`403 tenant_suspended` when suspended or closed) and have a gateway connection
        in this mode that can charge (`409 gateway_not_ready`). Unknown parameters are refused.
        Currency conversion (`fx`, ADR-0063) applies to USD links when the account enabled it:
        `fx_not_available` on MXN links and when it is off; `fx_rate_invalid` when a fixed rate
        is missing or more than 30 % from the latest published rate; and
        `amount_below_minimum_after_conversion` when the amount converts to less than MXN 10.00.
        `pre_payment_validation: true` needs a pre-payment validation URL
        configured in the panel for this mode (`400 validation_endpoint_not_configured`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/RequestIdIn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLinkRequest'
            examples:
              minimal:
                value:
                  amount: '1500.00'
                  currency: MXN
                  description: Order A-1029
              full:
                value:
                  amount: '1500.00'
                  currency: USD
                  description: 'Pedido #A-1029 — 2 artículos'
                  metadata: { order_id: A-1029, customer_id: C-77 }
                  client_reference_id: A-1029
                  expires_in_hours: 72
                  payer_fields: { email: required, phone: optional }
                  return_url: https://tienda.ejemplo.com/gracias?order=A-1029
                  auto_redirect: true
                  locale: es
              with_line_items:
                value:
                  amount: '12.30'
                  currency: USD
                  description: Recarga de saldo
                  line_items:
                    - { label: Recarga de saldo, amount: '10.00' }
                    - { label: Cargo por procesamiento, amount: '1.50', absorbs_rounding: true }
                    - { label: IVA, amount: '0.80' }
      responses:
        '201':
          description: The link was created (or replayed, with `Idempotent-Replayed`).
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Payment links]
      operationId: listPaymentLinks
      summary: List payment links
      description: |
        Scope `links:read`. Links of the key's account and mode, newest first. `starting_after`
        pages to older links, `ending_before` to newer ones (not both). Unknown query
        parameters are ignored.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PaymentLinkStatus' }
        - name: currency
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Currency' }
        - name: client_reference_id
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: created[gte]
          in: query
          required: false
          description: Created at or after. Unix seconds or ISO-8601 with a time zone.
          schema: { type: string }
        - name: created[lte]
          in: query
          required: false
          description: Created at or before. Unix seconds or ISO-8601 with a time zone.
          schema: { type: string }
        - $ref: '#/components/parameters/RequestIdIn'
      responses:
        '200':
          description: One page of links.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /payment_links/{id}:
    get:
      tags: [Payment links]
      operationId: retrievePaymentLink
      summary: Retrieve a payment link
      description: Scope `links:read`. Another account's or mode's link, or a wrong prefix, answers `404`.
      parameters:
        - $ref: '#/components/parameters/PaymentLinkId'
        - $ref: '#/components/parameters/RequestIdIn'
      responses:
        '200':
          description: The link.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /payment_links/{id}/cancel:
    post:
      tags: [Payment links]
      operationId: cancelPaymentLink
      summary: Cancel a payment link
      description: |
        Scope `links:cancel`. An active link becomes `canceled`. Canceling a canceled link
        answers `200` with the link unchanged. A paid or expired link answers
        `409 link_not_cancelable`; a link with a payment in progress, `409 link_payment_in_progress`.
        An active link already past its expiry is marked `expired` and answers
        `409 link_not_cancelable`. Allowed while the account is suspended. There is no endpoint to edit a link: cancel it and create a new one.
      parameters:
        - $ref: '#/components/parameters/PaymentLinkId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestIdIn'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPaymentLinkRequest'
      responses:
        '200':
          description: The canceled link.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payments
      description: |
        Scope `payments:read`. The payments of the key's account and mode, newest first. A payment is
        one attempt at the gateway for a link (a declined card does not create another one), so
        `payment_link` is also the way to read the payments of one link. `starting_after` pages to
        older payments, `ending_before` to newer ones (not both). A link of another account or mode
        lists nothing. Unknown query parameters are ignored.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PaymentStartingAfter'
        - $ref: '#/components/parameters/PaymentEndingBefore'
        - name: payment_link
          in: query
          required: false
          description: Only the payments of this link.
          schema:
            type: string
            pattern: '^plink_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        - name: status
          in: query
          required: false
          description: Only payments in this status.
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: created[gte]
          in: query
          required: false
          description: Created at or after. Unix seconds or ISO-8601 with a time zone.
          schema: { type: string }
        - name: created[lte]
          in: query
          required: false
          description: Created at or before. Unix seconds or ISO-8601 with a time zone.
          schema: { type: string }
        - $ref: '#/components/parameters/RequestIdIn'
      responses:
        '200':
          description: One page of payments.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /payments/{id}:
    get:
      tags: [Payments]
      operationId: retrievePayment
      summary: Retrieve a payment
      description: |
        Scope `payments:read`. The payment as it is now: its `status` (`requires_capture` is an
        authorization waiting for the capture, `processing`, `succeeded`, `canceled` is a void,
        `failed`), its link and `client_reference_id`, amount and currency, the applied `fx` block
        (null when no conversion applied), and the card's brand and country. Use it to confirm an
        event before acting on it (fetch-back). No gateway identifier, last digits, fingerprint or
        payer data is returned. Another account's or mode's payment, an unknown ID and a wrong
        prefix all answer `404`.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/RequestIdIn'
      responses:
        '200':
          description: The payment.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: |
        Scope `events:read`. The event history of the key's account and mode, newest first: every
        event that was or will be sent by webhook, whether or not an endpoint is subscribed, of the
        last 30 days. Each element is exactly the body of the webhook (see `Event`). The `ping`
        test event is not part of the history. `starting_after` pages to older events,
        `ending_before` to newer ones (not both). `created[gte]` and `created[lte]` refer to the
        moment the event was stored. Unknown query parameters are ignored.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/EventStartingAfter'
        - $ref: '#/components/parameters/EventEndingBefore'
        - name: type
          in: query
          required: false
          description: Only events of this type.
          schema: { $ref: '#/components/schemas/EventType' }
        - name: created[gte]
          in: query
          required: false
          description: Stored at or after. Unix seconds or ISO-8601 with a time zone.
          schema: { type: string }
        - name: created[lte]
          in: query
          required: false
          description: Stored at or before. Unix seconds or ISO-8601 with a time zone.
          schema: { type: string }
        - $ref: '#/components/parameters/RequestIdIn'
      responses:
        '200':
          description: One page of events.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}:
    get:
      tags: [Events]
      operationId: retrieveEvent
      summary: Retrieve an event
      description: |
        Scope `events:read`. The event with exactly the body that was or will be sent by webhook,
        so it can be used to confirm a webhook before acting on it (fetch-back). Another account's
        or mode's event, a `ping`, an event older than 30 days, an unknown ID and a wrong prefix
        all answer `404`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/RequestIdIn'
      responses:
        '200':
          description: The event.
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
webhooks:
  event:
    post:
      tags: [Outgoing webhooks]
      operationId: receiveEvent
      summary: Event delivery (sent to your webhook endpoint)
      description: |
        Not an endpoint of this API: the request AxisPay sends to each webhook endpoint you
        configured in the panel, for the events it subscribes to (plan 15; ADR-0008, ADR-0057).
        Signed as [Standard Webhooks](https://www.standardwebhooks.com/): verify the signature on
        the raw body with the endpoint's `whsec_` secret before parsing it, reject timestamps more
        than 5 minutes from your clock, and deduplicate by `webhook-id` (the event ID).

        Answer with any `2xx` status within 10 seconds (5 seconds to connect); anything else,
        redirects included, is a failure. A failed delivery is retried immediately, then after
        5 seconds, 5 minutes, 30 minutes, 2 hours, 5 hours, 10 hours and 10 hours (8 attempts in
        about 27 hours), then abandoned. Delivery is at least once and the order is not
        guaranteed. The body never changes between attempts. After a secret rotation the
        previous secret keeps signing for 24 hours and `webhook-signature` holds both signatures
        separated by a space. Only `https` URLs (ports 443 and 8443) are called, and redirects
        are not followed. An endpoint failing for 5 days in a row is disabled.
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
        - { $ref: '#/components/parameters/WebhookTimestamp' }
        - { $ref: '#/components/parameters/WebhookSignature' }
        - name: User-Agent
          in: header
          required: true
          schema: { type: string, const: AxisPay-Webhooks/1.0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
            examples:
              payment.succeeded:
                $ref: '#/components/examples/PaymentSucceededEvent'
              payment.failed:
                $ref: '#/components/examples/PaymentFailedEvent'
              payment.canceled:
                $ref: '#/components/examples/PaymentCanceledEvent'
      responses:
        '2XX':
          description: The event was received (the body of your answer is not used).
  prePaymentValidation:
    post:
      tags: [Pre-payment validation]
      operationId: receivePrePaymentValidation
      summary: Pre-payment validation call (sent to your validation URL)
      description: |
        Not an endpoint of this API and not a webhook: a synchronous question AxisPay asks your
        server, when a link has `pre_payment_validation` on, after the payer's card was authorized
        and before it is charged (plan 15.8; ADR-024, ADR-0058). Your answer decides whether the
        payment is charged.

        Signed like the events (Standard Webhooks, with the validation URL's own secret), with
        `webhook-id` = the call ID (`val_...`) and an extra header
        `x-axispay-kind: pre_payment_validation`. Answer `200` with a JSON object of at most 4 KB
        within 30 seconds in total by default (2 seconds to connect; the platform operator sets the
        limit with `AXISPAY_VALIDATION_TIMEOUT_SECONDS`, from 5 to 60 seconds, ADR-0061). The
        connection is retried once, at once, only when it could not be opened; never after your
        server received the request. The `pay_` ID in `data.payment.id` names the payment attempt
        and is the same in that retry and in every other call about the same attempt.

        Failures are: no answer in time, a connection or TLS error, a status other than `200`
        (redirects are not followed), an invalid answer (not a JSON object, `decision` missing or
        not `approve` or `reject`), and a destination blocked by the security rules. On a failure
        the merchant's policy applies: `fail_closed` (default) does not charge, `fail_open`
        charges and marks the payment `pre_validation.outcome = failed`. Unknown fields in the
        answer are ignored. An approval does not guarantee the charge: confirm the sale with
        `payment.succeeded` (or `GET /events`). If you reserve stock when approving, release it if
        `payment.succeeded` does not arrive within a reasonable time (15 minutes is a good default).
        A payer who retries after a declined card is validated again (`attempt_number`).
      parameters:
        - { $ref: '#/components/parameters/WebhookId' }
        - { $ref: '#/components/parameters/WebhookTimestamp' }
        - { $ref: '#/components/parameters/WebhookSignature' }
        - name: x-axispay-kind
          in: header
          required: true
          schema: { type: string, const: pre_payment_validation }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrePaymentValidationRequest'
      responses:
        '200':
          description: Your decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrePaymentValidationAnswer'
              examples:
                approve:
                  value: { decision: approve }
                reject:
                  value:
                    decision: reject
                    reason_code: out_of_stock
                    payer_message: One of the items is no longer available. Contact the store.
                    cancel_link: false
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: axp_{test|live}_<secret>
      description: |
        `Authorization: Bearer axp_live_<secret>` or `axp_test_<secret>` (plan 10.2).
        The prefix selects the mode; a test key never reaches live resources.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Recommended on every POST and required on `POST /v1/payment_links` and
        `POST /v1/refunds` (plan 10.3). Same key + same body within 24 hours replays
        the original response with `Idempotent-Replayed: true`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9_\-:.]+$'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required. A unique value per intended link (for example your order number plus an
        attempt counter). Missing: `400 idempotency_key_required`. A key that created a link
        can never create another one: reused with another body, even after 24 hours, it
        answers `422 idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9_\-:.]+$'
    PaymentLinkId:
      name: id
      in: path
      required: true
      description: Payment link ID with its prefix.
      schema:
        type: string
        pattern: '^plink_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        examples:
          - plink_01J8Z3Q6T4Y0V8KX2M1N5P7R9S
    PaymentId:
      name: id
      in: path
      required: true
      description: Payment ID with its prefix.
      schema:
        type: string
        pattern: '^pay_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        examples:
          - pay_01J8Z4Q6T4Y0V8KX2M1N5P7R9S
    PaymentStartingAfter:
      name: starting_after
      in: query
      required: false
      description: A payment ID; returns the payments created before it.
      schema:
        type: string
    PaymentEndingBefore:
      name: ending_before
      in: query
      required: false
      description: A payment ID; returns the payments created after it.
      schema:
        type: string
    EventId:
      name: id
      in: path
      required: true
      description: Event ID with its prefix (the `webhook-id` of its delivery).
      schema:
        type: string
        pattern: '^evt_[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        examples:
          - evt_01J8Z5Q6T4Y0V8KX2M1N5P7R9S
    EventStartingAfter:
      name: starting_after
      in: query
      required: false
      description: An event ID; returns the events stored before it.
      schema:
        type: string
    EventEndingBefore:
      name: ending_before
      in: query
      required: false
      description: An event ID; returns the events stored after it.
      schema:
        type: string
    WebhookId:
      name: webhook-id
      in: header
      required: true
      description: The event ID (`evt_...`), or the call ID (`val_...`) of a pre-payment validation. Stable across retries; deduplicate by it.
      schema:
        type: string
    WebhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: Seconds since 1970 when this attempt was signed (changes on every attempt).
      schema:
        type: integer
    WebhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: |
        `v1,<base64 HMAC-SHA256>` of `{webhook-id}.{webhook-timestamp}.{raw body}` with the secret
        (the base64-decoded part after `whsec_`). Several signatures separated by a space during
        a secret rotation; one match is enough.
      schema:
        type: string
    RequestIdIn:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Optional client correlation ID. Reused as the `Request-Id` when it matches
        the safe format; otherwise a new `req_<ULID>` is generated.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: A link ID; returns the links created before it.
      schema:
        type: string
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: A link ID; returns the links created after it.
      schema:
        type: string
  headers:
    RequestId:
      description: Unique ID of the request, also written to the logs.
      schema:
        type: string
        examples:
          - req_01J8Z3Q6T4Y0V8KX2M1N5P7R9S
    IdempotentReplayed:
      description: Present with value `true` when the response is an idempotent replay.
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Seconds to wait before retrying (rate limiting).
      schema:
        type: integer
    RateLimitLimit:
      description: Requests allowed per minute for this API key.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current one-minute window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
  schemas:
    Currency:
      type: string
      enum: [USD, MXN]
      description: ISO 4217 code. Lowercase input is normalized.
    MoneyAmount:
      type: string
      description: |
        Decimal string with at most the currency's decimals (2 for USD and MXN),
        no sign, spaces, thousands separators or exponent (plan 8.2). A JSON number
        is rejected with `amount_must_be_string`.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      examples:
        - '150.50'
    Money:
      type: object
      description: Response representation of an amount (plan 8.3).
      required: [amount, amount_minor, currency]
      properties:
        amount:
          type: string
          description: Exact decimal string with the currency's number of decimals.
          examples:
            - '150.50'
        amount_minor:
          type: integer
          format: int64
          description: Amount in minor units (cents).
          examples:
            - 15050
        currency:
          $ref: '#/components/schemas/Currency'
    LineItem:
      type: object
      additionalProperties: false
      required: [label, amount]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Plain text, 1 to 100 characters after trimming.
        amount:
          type: string
          description: |
            Decimal string greater than zero in the link's currency. The minimum and maximum
            charge of a whole payment do not apply to a single line.
          example: '10.00'
        absorbs_rounding:
          type: boolean
          default: false
          description: |
            The line that takes the rounding residual when the link is converted to MXN, so the
            converted lines add up to the amount charged. At most one; exactly one when the link
            can be converted.
    ExchangeRate:
      type: string
      description: Decimal string with up to 6 decimals, greater than zero.
      pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
      examples:
        - '17.422500'
    ErrorType:
      type: string
      enum:
        - invalid_request_error
        - authentication_error
        - permission_error
        - rate_limit_error
        - api_error
    ErrorCode:
      type: string
      description: Stable machine-readable code (`ApiErrorCode` enum). New codes may be added.
      enum:
            - invalid_api_key
            - insufficient_scope
            - tenant_suspended
            - gateway_not_ready
            - parameter_missing
            - parameter_invalid
            - amount_must_be_string
            - amount_invalid
            - amount_below_minimum
            - amount_above_maximum
            - amount_below_minimum_after_conversion
            - currency_not_supported
            - expiration_out_of_range
            - fx_not_available
            - fx_rate_invalid
            - metadata_invalid
            - return_url_not_allowed
            - payer_field_invalid
            - validation_endpoint_not_configured
            - idempotency_key_required
            - idempotency_key_reused
            - idempotency_request_in_progress
            - resource_not_found
            - link_not_cancelable
            - link_payment_in_progress
            - refund_exceeds_available
            - payment_not_refundable
            - rate_limited
            - gateway_error
            - internal_error
            - method_not_allowed
            - service_unavailable
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, param, request_id]
          properties:
            type:
              $ref: '#/components/schemas/ErrorType'
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable explanation. Do not parse it; use `code`.
            param:
              type: [string, 'null']
              description: The request parameter the error refers to, when there is one.
            request_id:
              type: string
      examples:
        - error:
            type: invalid_request_error
            code: currency_not_supported
            message: "The currency 'EUR' is not supported. Allowed currencies: USD, MXN."
            param: currency
            request_id: req_01J8Z3Q6T4Y0V8KX2M1N5P7R9S
    PaymentLinkStatus:
      type: string
      enum: [active, processing, paid, expired, canceled]
      description: |
        `active`: can be opened and paid. `processing`: a payment is in progress (from Phase 4).
        `paid`: terminal. `expired` / `canceled`: can no longer be paid.
    PayerFieldRequirement:
      type: string
      enum: [hidden, optional, required]
    PayerFields:
      type: object
      description: Payer field catalog (plan 19.1). In a request, overrides per field.
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/PayerFieldRequirement' }
        full_name: { $ref: '#/components/schemas/PayerFieldRequirement' }
        phone: { $ref: '#/components/schemas/PayerFieldRequirement' }
        company_name: { $ref: '#/components/schemas/PayerFieldRequirement' }
        billing_address: { $ref: '#/components/schemas/PayerFieldRequirement' }
        tax_id: { $ref: '#/components/schemas/PayerFieldRequirement' }
        notes: { $ref: '#/components/schemas/PayerFieldRequirement' }
    Metadata:
      type: object
      description: |
        Private key-value data, never shown to the payer. Up to 20 keys; keys 1-40 characters
        from `A-Z a-z 0-9 _ -` (digit-only keys such as `"0"` are valid); values strings up to
        500 characters; nothing nested; a JSON list is refused. Always returned as an object.
        Do not put personal data or secrets here. Invalid: `metadata_invalid`.
      maxProperties: 20
      propertyNames:
        pattern: '^[A-Za-z0-9_\-]{1,40}$'
      additionalProperties:
        type: string
        maxLength: 500
    CreatePaymentLinkRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, description]
      properties:
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Shown to the payer as plain text.
        metadata:
          $ref: '#/components/schemas/Metadata'
        client_reference_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Your own reference, for example your order number. Filterable.
        expires_in_hours:
          type: integer
          minimum: 1
          description: |
            Not with `expires_at`. Default: the account's default (7 days unless lowered).
            The expiry must be 15 minutes to the account's maximum (60 days at most; the account
            may set a lower default and maximum in its payment settings) from now, else
            `expiration_out_of_range`.
        expires_at:
          type: string
          format: date-time
          description: ISO-8601 with a time zone; impossible dates (e.g. February 31) are refused. Not with `expires_in_hours`.
        fx:
          type: object
          additionalProperties: false
          required: [mode]
          description: |
            Currency conversion for USD links (plan 13, ADR-0063). A card issued in Mexico paying
            a USD link of a Mexican account is charged in MXN, after the payer confirms the exact
            amount. Refused with `fx_not_available` on MXN links and when the account has not
            enabled conversion. Omitted: a USD link of an account with conversion on takes the
            account's default mode. `fixed` takes this `rate`; without one (a link that took the
            account's default mode) the account's fixed rate applies when the payment is made.
          properties:
            mode:
              type: string
              enum: [none, banxico_fix, fixed]
            rate:
              $ref: '#/components/schemas/ExchangeRate'
        payer_fields:
          $ref: '#/components/schemas/PayerFields'
        line_items:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            The merchant's breakdown of the amount, shown on the payment page (ADR-0064). Display
            only: the link is charged its `amount`. The amounts must add up exactly to `amount`
            (else `parameter_invalid` on `line_items`), at most one item has `absorbs_rounding:
            true`, and exactly one when the link can be converted to MXN. On the currency
            confirmation the lines are shown converted and add up to the MXN amount charged.
          items:
            $ref: '#/components/schemas/LineItem'
        return_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Where the payer returns after paying. HTTPS in live mode; the host must be one of
            the account's allowed return domains, else `return_url_not_allowed`. After a payment
            the URL gets a signed proof appended: `ref` (the `client_reference_id`, when there is
            one), `plink`, `payment`, `status=paid`, `ts` and `sig` (hex HMAC-SHA256 of
            `plink\npayment\nstatus\nts\nref` with the account's return secret; one signature
            per active secret, comma separated, during a rotation). The expired and canceled
            pages offer a plain "Return" button to it. See the integration guide to verify it.
        auto_redirect:
          type: boolean
          default: false
          description: |
            Send the payer back to `return_url` by themselves, after a short countdown they can
            stop, once the payment succeeded. Needs `return_url` (else `parameter_invalid`).
        locale:
          type: string
          enum: [es, en]
          description: Payment page language. Default the account's.
        pre_payment_validation:
          type: boolean
          description: |
            Whether the account's server is asked to approve each payment of this link, after
            the card is authorized and before it is charged (a signed synchronous call, see
            the integration guide). `true` needs a pre-payment validation URL configured in the
            panel for this mode, else `400 validation_endpoint_not_configured`. `false` turns it
            off. Omitted: the URL's "use for new links" setting decides (off when no URL is
            configured). Frozen when the link is created.
    CancelPaymentLinkRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: Visible in the API and the panel, never to the payer.
    PaymentLink:
      type: object
      required:
        - id
        - object
        - livemode
        - status
        - url
        - amount
        - amount_minor
        - currency
        - description
        - metadata
        - client_reference_id
        - fx
        - payer_fields
        - line_items
        - return_url
        - auto_redirect
        - locale
        - pre_payment_validation
        - expires_at
        - paid_at
        - canceled_at
        - cancel_reason
        - expired_at
        - refund_status
        - dispute_status
        - open_count
        - first_opened_at
        - payment
        - created_at
      properties:
        id:
          type: string
          examples: [plink_01J8Z3Q6T4Y0V8KX2M1N5P7R9S]
        object:
          const: payment_link
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/PaymentLinkStatus'
        url:
          type: string
          format: uri
          description: Public payment page, `https://pay.<domain>/l/<token>`. Anyone with it can pay; share it only with the payer.
        amount:
          type: string
          examples: ['1500.00']
        amount_minor:
          type: integer
          format: int64
          examples: [150000]
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        client_reference_id:
          type: [string, 'null']
        fx:
          type: object
          required: [mode, rate]
          properties:
            mode:
              type: string
              enum: [none, banxico_fix, fixed]
            rate:
              type: [string, 'null']
              description: Only with `fixed`. Null when the link uses the account's own fixed rate.
        payer_fields:
          $ref: '#/components/schemas/PayerFields'
        line_items:
          type: [array, 'null']
          description: The merchant's breakdown of the amount, or null.
          items:
            $ref: '#/components/schemas/LineItem'
        return_url:
          type: [string, 'null']
        auto_redirect:
          type: boolean
          description: Whether the payer is sent back to `return_url` by themselves after paying.
        locale:
          type: string
          enum: [es, en]
        pre_payment_validation:
          type: boolean
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        canceled_at:
          type: [string, 'null']
          format: date-time
        cancel_reason:
          type: [string, 'null']
          description: >-
            Why the link was canceled. The free text given by whoever canceled
            it (API or panel), or one of the reasons the platform records when
            it cancels a link itself: `gateway_disconnected` (the tenant's
            payment gateway was disconnected in this mode), `tenant_closed`
            (the tenant's account was closed) or `rejected_by_merchant` (the
            account's pre-payment validation rejected a payment and asked to
            cancel the link).
        expired_at:
          type: [string, 'null']
          format: date-time
        refund_status:
          type: string
          enum: [none, partial, full]
        dispute_status:
          type: string
          enum: [none, open, won, lost]
        open_count:
          type: integer
        first_opened_at:
          type: [string, 'null']
          format: date-time
        payment:
          type: 'null'
          description: Always null for now; the summarized payment arrives in a later phase.
        created_at:
          type: string
          format: date-time
    PaymentLinkList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLink'
        has_more:
          type: boolean
          description: More links exist in the direction paged.
    EventType:
      type: string
      description: |
        Event types (plan 15.2). Sent today: `payment_link.opened`, `payment_link.paid`,
        `payment.processing`, `payment.succeeded`, `payment.failed`, `payment.canceled`. Defined and subscribable but
        not sent until their phase: `payment_link.created`, `payment_link.expired`,
        `payment_link.canceled`, `refund.created`, `refund.succeeded`, `refund.failed`,
        `dispute.created`, `dispute.closed`. `ping` (the panel's test event) is not subscribable
        and is not in the event history. New types may be added: ignore the ones you do not know.
      enum:
        - payment_link.created
        - payment_link.opened
        - payment_link.paid
        - payment_link.expired
        - payment_link.canceled
        - payment.processing
        - payment.succeeded
        - payment.failed
        - payment.canceled
        - refund.created
        - refund.succeeded
        - refund.failed
        - dispute.created
        - dispute.closed
    PreValidation:
      type: object
      description: |
        How the pre-payment validation of a payment ended (plan 15.8.5). Absent (`null` in
        `payment.pre_validation`) when no validation applied.
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [approved, rejected, failed]
        policy_applied:
          type: string
          enum: [fail_open, fail_closed]
          description: 'Only with `outcome: failed`. `fail_open` means the payment was charged without an answer; review it.'
    PaymentStatus:
      type: string
      enum:
        - requires_payment_method
        - requires_confirmation
        - requires_action
        - requires_capture
        - processing
        - succeeded
        - failed
        - canceled
    PaymentFx:
      type: object
      description: |
        The conversion applied to a payment (ADR-0063): a card issued in Mexico that paid a USD
        link, charged in MXN with the exact amount the payer confirmed.
      required: [applied, mode, source, rate, rate_date, markup_bps, effective_rate, original_amount, original_currency]
      properties:
        applied:
          type: boolean
          const: true
        mode:
          type: string
          enum: [fixed, banxico_fix]
        source:
          type: string
          enum: [merchant, banxico_fix]
          description: Who set the rate, the merchant (a fixed rate) or Banxico's FIX.
        rate:
          $ref: '#/components/schemas/ExchangeRate'
        rate_date:
          type: [string, 'null']
          format: date
          description: Publication date of the FIX; null with a fixed rate.
        markup_bps:
          type: integer
          description: The merchant's markup over the FIX in basis points; always 0 with a fixed rate.
        effective_rate:
          $ref: '#/components/schemas/ExchangeRate'
        original_amount:
          type: string
          description: The link's amount, e.g. `12.30`.
        original_currency:
          $ref: '#/components/schemas/Currency'
      examples:
        - applied: true
          mode: fixed
          source: merchant
          rate: '20.000000'
          rate_date: null
          markup_bps: 0
          effective_rate: '20.000000'
          original_amount: '12.30'
          original_currency: USD
    Payment:
      type: object
      description: |
        The payment as an event carries it, frozen when the event happened. One payment is one
        attempt at the gateway; a declined card does not create another. Our identifiers only:
        no gateway IDs and no raw decline code.
      required: [id, object, livemode, payment_link, client_reference_id, status, amount, amount_minor, currency, fx, late_payment, failure_count, failure, pre_validation, captured_at, created_at]
      properties:
        id:
          type: string
          examples: [pay_01J8Z4Q6T4Y0V8KX2M1N5P7R9S]
        object:
          const: payment
        livemode:
          type: boolean
        payment_link:
          type: string
          description: ID of the payment link.
          examples: [plink_01J8Z3Q6T4Y0V8KX2M1N5P7R9S]
        client_reference_id:
          type: [string, 'null']
          description: The `client_reference_id` of the link (your reference); null when the link has none.
          examples: [ORDER-1029]
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: string
          examples: ['1500.00']
        amount_minor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        fx:
          oneOf:
            - $ref: '#/components/schemas/PaymentFx'
            - type: 'null'
          description: |
            The currency conversion applied to this payment, null when it was charged in the
            link's own currency. `amount` and `currency` are what was charged (MXN);
            `fx.original_amount` and `fx.original_currency` are the link's. Reconcile with both.
        late_payment:
          type: boolean
          description: The payment succeeded after its link expired or was canceled.
        failure_count:
          type: integer
          description: Declined cards so far on this payment.
        failure:
          type: [object, 'null']
          required: [code]
          properties:
            code:
              type: string
              enum: [card_declined, insufficient_funds, expired_card, incorrect_card_details, authentication_failed, processing_error]
              description: Generic code; new codes may be added.
        pre_validation:
          oneOf:
            - $ref: '#/components/schemas/PreValidation'
            - type: 'null'
        captured_at:
          type: [string, 'null']
          format: date-time
          description: When the payment was captured (it became `succeeded`); null until then.
        created_at:
          type: string
          format: date-time
    PaymentDetail:
      description: |
        The payment as `GET /payments` shows it: the object the events carry plus the card's brand
        and country and the authorization and cancellation times. Never the gateway ID, the number,
        the last digits, a fingerprint or payer data.
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [card, authorized_at, canceled_at]
          properties:
            card:
              type: object
              required: [brand, country]
              properties:
                brand:
                  type: [string, 'null']
                  examples: [visa]
                country:
                  type: [string, 'null']
                  description: ISO 3166-1 alpha-2 country of the card.
                  examples: [MX]
            authorized_at:
              type: [string, 'null']
              format: date-time
              description: When the payment was first authorized; null if it never was.
            canceled_at:
              type: [string, 'null']
              format: date-time
              description: When the payment was voided or closed as canceled; null otherwise.
    PaymentList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDetail'
        has_more:
          type: boolean
          description: More payments exist in the direction paged.
    EventData:
      type: object
      description: |
        `object` is the event's main object, in the shape the API shows it; the other keys depend
        on the type.

        | Type | `object` | Other keys |
        |---|---|---|
        | `payment_link.opened` | `PaymentLink` | `open_count` (integer), `first_open` (boolean) |
        | `payment_link.paid` | `PaymentLink` | `payment` (`Payment`), `late_payment` (boolean) |
        | `payment.processing` | `Payment` | none |
        | `payment.succeeded` | `Payment` | `payment_link` (`PaymentLink`), `late_payment` (boolean) |
        | `payment.failed` | `Payment` | `failure_count` (integer), `failure_code` (string) |
        | `payment.canceled` | `Payment` | `reason` (string: `merchant_rejected`, `validation_failed`, `capture_window_elapsed`, `link_closed`, `abandoned_action` or `gateway_canceled`; new reasons may be added) |
        | `ping` | `{ "object": "ping", "message": "Test event." }` | none |

        Ignore keys you do not know.
      required: [object]
      properties:
        object:
          type: object
      additionalProperties: true
    Event:
      type: object
      description: |
        An event: the body of the webhook, byte for byte the same in every delivery, resend and
        read of the history. Amounts and objects are those of the API at the moment it happened.
      required: [id, type, api_version, livemode, created_at, data]
      properties:
        id:
          type: string
          description: Also the `webhook-id` header of every delivery.
          examples: [evt_01J8Z5Q6T4Y0V8KX2M1N5P7R9S]
        type:
          oneOf:
            - $ref: '#/components/schemas/EventType'
            - { type: string, const: ping }
        api_version:
          const: v1
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: When the event happened (UTC).
        data:
          $ref: '#/components/schemas/EventData'
    EventList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        has_more:
          type: boolean
          description: More events exist in the direction paged.
    PrePaymentValidationRequest:
      type: object
      description: Body of the pre-payment validation call (plan 15.8.3).
      required: [id, type, livemode, test, created_at, attempt_number, data]
      properties:
        id:
          type: string
          description: Call ID, also the `webhook-id`.
          examples: [val_01J8Z6Q6T4Y0V8KX2M1N5P7R9S]
        type:
          const: payment.pre_validation
        livemode:
          type: boolean
        test:
          type: boolean
          description: "`true` for the example sent by the panel's \"Test validation\" button: no link or payment is behind it."
        created_at:
          type: string
          format: date-time
        attempt_number:
          type: integer
          minimum: 1
          description: Which validation this is for the link (the payer may retry after a declined card).
        data:
          type: object
          required: [payment, payment_link, charge, card, payer]
          properties:
            payment:
              type: object
              description: |
                The payment attempt this call is about. `id` is stable: the immediate retry after a
                connection failure and every later call about the same attempt carry the same ID,
                and each new attempt of the link (a payer who retries after a declined card) has its
                own.
              required: [id]
              properties:
                id:
                  type: string
                  description: ID of the payment attempt (`pay_...`).
                  examples: [pay_01J8Z6Q6T4Y0V8KX2M1N5P7R9S]
            payment_link:
              type: object
              required: [id, client_reference_id, metadata, description, amount, currency, expires_at]
              properties:
                id: { type: string }
                client_reference_id: { type: [string, 'null'] }
                metadata: { $ref: '#/components/schemas/Metadata' }
                description: { type: string }
                amount: { type: string }
                currency: { $ref: '#/components/schemas/Currency' }
                expires_at: { type: string, format: date-time }
            charge:
              type: object
              description: |
                The amount and currency about to be charged: already converted to MXN when `fx` says so
                (`payment_link.amount` and `currency` stay the link's).
              required: [amount, currency, fx]
              properties:
                amount: { type: string }
                currency: { $ref: '#/components/schemas/Currency' }
                fx:
                  description: '`{"applied": false}`, or the conversion applied (the `PaymentFx` block).'
                  oneOf:
                    - $ref: '#/components/schemas/PaymentFx'
                    - type: object
                      required: [applied]
                      properties:
                        applied: { type: boolean, const: false }
            card:
              type: object
              description: Brand and country only; never the number.
              properties:
                brand: { type: [string, 'null'] }
                country: { type: [string, 'null'] }
            payer:
              type: [object, 'null']
              description: The e-mail and full name, when the link collected them.
              properties:
                email: { type: string }
                full_name: { type: string }
    PrePaymentValidationAnswer:
      type: object
      description: Your answer. Only `decision` decides whether the answer is valid; a mistake in an optional field drops that field.
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason_code:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
          description: Your own code for a rejection; shown in the panel.
        payer_message:
          type: string
          maxLength: 200
          description: Plain text shown to the payer on a rejection (longer text is shortened). Without it the payer sees a generic message.
        cancel_link:
          type: boolean
          default: false
          description: With `true` on a rejection the link is canceled (`rejected_by_merchant`). Ignored on an approval.
    ListEnvelope:
      type: object
      description: Cursor-paginated list (plan 10.1).
      required: [object, data, has_more]
      properties:
        object:
          const: list
        data:
          type: array
          items: {}
        has_more:
          type: boolean
