# Nginx for the web role (ADR-0035). Runs as the unprivileged container user,
# so it listens on 8080 and keeps its pid and temp files under /tmp. TLS is
# terminated by the reverse proxy in front (Traefik in Dokploy).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Off on purpose: URLs can carry single-use tokens (plan 23.3). Traefik
    # and the application log request metadata instead.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 16m;

    # Security headers the application may set itself (the checkout sets
    # stricter ones, ADR-0051): nginx only adds its default when the
    # application sent none, so a response never carries two values.
    map $upstream_http_x_frame_options $axispay_frame_options {
        ''      "SAMEORIGIN";
        default "";
    }
    map $upstream_http_referrer_policy $axispay_referrer_policy {
        ''      "strict-origin-when-cross-origin";
        default "";
    }
    map $upstream_http_strict_transport_security $axispay_hsts {
        ''      "max-age=31536000; includeSubDomains";
        default "";
    }
    map $upstream_http_permissions_policy $axispay_permissions_policy {
        ''      "camera=(), microphone=(), geolocation=()";
        default "";
    }
    map $upstream_http_x_content_type_options $axispay_nosniff {
        ''      "nosniff";
        default "";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Security headers for every surface (plan 23.4). HSTS is only honored
        # by browsers over HTTPS; the proxy terminates TLS. Defaults only: the
        # checkout (pay host) sends its own CSP, X-Frame-Options DENY,
        # Referrer-Policy no-referrer and a longer HSTS (plan 11.8, ADR-0051),
        # and an empty value here means nginx adds nothing.
        add_header Strict-Transport-Security $axispay_hsts always;
        add_header X-Content-Type-Options $axispay_nosniff always;
        add_header X-Frame-Options $axispay_frame_options always;
        add_header Referrer-Policy $axispay_referrer_policy always;
        add_header Permissions-Policy $axispay_permissions_policy always;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Self-hosted fonts are also loaded by Stripe's card iframe (another
        # origin) on the checkout, so they are served with CORS (ADR-0051).
        location ~ ^/build/assets/.+\.woff2$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Hashed, immutable build output.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTP_PROXY "";
            # The payer's Pay request answers within its own time budget (the
            # application never starts a Stripe call that could not finish in
            # time, and answers "processing" instead, ADR-0051). The budget
            # follows AXISPAY_VALIDATION_TIMEOUT_SECONDS (ADR-0061), so this
            # limit (the budget + 10 s; 60 s at 5 s) is written at start by the
            # entrypoint: `fastcgi_read_timeout`.
            include /tmp/axispay-timeouts.conf;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Never serve dotfiles or other PHP entry points.
        location ~ /\.(?!well-known) { deny all; }
        location ~ \.php$ { return 404; }
    }
}
