; Production PHP settings (ADR-0035), loaded after php.ini-production.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 30
post_max_size = 16M
upload_max_filesize = 8M
date.timezone = UTC

; Sessions are handled by Laravel; PHP's own session cookie is never used.
session.use_strict_mode = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: code is immutable inside the image, so timestamps are never
; revalidated. A new release is a new container, never an in-place edit.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off
