; PHP-FPM for the web role (ADR-0035). The master runs as www-data (the
; container user), so no user/group directives are set.

[global]
error_log = /proc/self/fd/2
log_limit = 65536
daemonize = no
; On SIGQUIT, FPM waits this long for running requests before killing them.
process_control_timeout = 25s

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Laravel logs JSON to php://stderr; forward it to the container log as is.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Access logs stay off: request URLs can carry single-use tokens (signed
; invitation and impersonation links). The application logs metadata.
access.log = /dev/null
