; supervisord for the all-in-one role (ADR-0039): staging and local/test
; servers only. Production runs one container per role (ADR-0036).
;
; Runs as www-data (the image user), so no `user=` directives. No control
; socket or HTTP server is configured: supervisorctl is not available, and a
; process is restarted by restarting the container.
;
; Start order (lower priority first): php-fpm, nginx, then the workers and the
; scheduler. Stop order is the reverse and sequential per group: the
; `background` group (both workers and the scheduler, stopped in parallel so
; each running job can finish), then nginx (drains), then php-fpm.
;
; Every program writes to the container's stdout/stderr; no log files.
; %(ENV_*)s values are exported by the entrypoint before supervisord starts.

[supervisord]
nodaemon=true
; With nodaemon, supervisord already echoes its own log to stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[program:php-fpm]
command=php-fpm --nodaemonize
directory=/var/www/html
priority=100
autostart=true
autorestart=true
startsecs=2
startretries=3
; SIGQUIT: graceful; FPM waits up to process_control_timeout (25 s).
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
directory=/var/www/html
priority=200
autostart=true
autorestart=true
startsecs=2
startretries=3
; SIGQUIT: stop accepting connections and drain the open ones.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Same command and flags as the `worker` role (run_queue_worker in the
; entrypoint). SIGTERM lets the running job finish; stopwaitsecs is
; QUEUE_TIMEOUT + 15 s.
[program:worker-critical]
command=/usr/local/bin/axispay-entrypoint queue-work critical
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=%(ENV_QUEUE_STOP_WAIT_SECONDS)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-default]
command=/usr/local/bin/axispay-entrypoint queue-work default,low
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=%(ENV_QUEUE_STOP_WAIT_SECONDS)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; schedule:work starts a schedule:run child every minute; stop the whole
; process group so a running schedule:run gets the signal too.
[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=%(ENV_QUEUE_STOP_WAIT_SECONDS)s
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[group:background]
programs=worker-critical,worker-default,scheduler
priority=300
